name: CI/CD → Docker Hub

# Builds eventstracker and pushes a fresh :latest image to Docker Hub on every
# push to the default branch. Watchtower running in the VirtualBox / Portainer
# VM polls Docker Hub every 5 min and redeploys automatically.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/eventstracker

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Auto-fix formatting instead of failing the build. spotless:check is
      # still bound to the validate phase below as a safety net, but by the
      # time it runs the sources are already formatted, so it just passes.
      - name: Auto-format with Spotless
        run: ./mvnw spotless:apply -B

      - name: Commit formatting fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format code with Spotless [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No formatting changes needed."
          fi

      # eventstracker depends on com.sathish:sathish-projects-logger as a local
      # SNAPSHOT, which is not on Maven Central. Build & install it first.
      - name: Install sathish-projects-logger dependency
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/sathish-projects-logger.git /tmp/sathish-projects-logger
          cd /tmp/sathish-projects-logger
          ./mvnw install -DskipTests -B || mvn install -DskipTests -B

      - name: Build eventstracker (skip tests)
        run: |
          ./mvnw package -DskipTests -B
          mv target/*.jar target/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Write summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA tag**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Watchtower** will auto-redeploy in ≤ 5 min" >> "$GITHUB_STEP_SUMMARY"
