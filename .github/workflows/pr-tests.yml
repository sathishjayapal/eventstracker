name: PR tests

# Runs the full test suite (unit + Testcontainers integration tests) on every pull request to the
# default branch. Deliberately separate from deploy-portainer.yml, which publishes the image on
# push to master. Replaced by the fuller runs-app-style pipeline in the CI/CD alignment PR.

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Surefire's defaults skip *IT classes and the pom has no Failsafe plugin, so name every
      # test class pattern explicitly. Spotless check is bound to the validate phase, so
      # formatting violations fail here too. Docker is preinstalled on ubuntu-latest, which the
      # Testcontainers-backed tests (Postgres, RabbitMQ) need.
      - name: Run tests
        run: ./mvnw -B test -Dtest='*Test,*Tests,*IT' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
